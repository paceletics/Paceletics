<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paceletics | Session Builder</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=0.8.2"></script>
<style>
:root{--bg:#07101d;--panel:#101a2a;--line:#263651;--text:#f6f8fb;--muted:#9caac0;--orange:#ff8a00;--yellow:#ffc400;--green:#5fe3a1;--red:#ff9aaa}*{box-sizing:border-box}body{margin:0;background:#07101d;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:grid;place-items:center;color:#171108;font-weight:1000}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#171108}.secondary{background:#1a2942;color:#fff;border:1px solid #314865}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.span5{grid-column:span 5}.span7{grid-column:span 7}.span12{grid-column:span 12}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.full{grid-column:1/-1}label{display:block;color:#cbd6e4;font-size:12px;margin-bottom:5px}input,select,textarea{width:100%;background:#0c1525;border:1px solid #334560;color:#fff;padding:10px;border-radius:9px}textarea{resize:vertical}.item{background:#111d31;border:1px solid #263650;border-radius:11px;padding:10px;margin-top:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{border-radius:999px;padding:4px 8px;background:#3b2b13;color:#ffd469;font-size:11px;font-weight:900}.target{font-size:24px;font-weight:1000;margin-top:5px}.loading{position:fixed;inset:0;background:#07101d;display:grid;place-items:center;text-align:center;z-index:100}.hidden{display:none!important}.error{max-width:520px;background:#171725;border:1px solid #653141;border-radius:16px;padding:20px}.summary{line-height:1.7}.saved{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:13px}@media(max-width:800px){.wrap{padding:13px}.top{align-items:flex-start;flex-direction:column}.span5,.span7{grid-column:span 12}.formgrid{grid-template-columns:1fr}.saved{grid-template-columns:1fr}}
</style></head>
<body>
<div id="loading" class="loading"><div><div class="logo" style="margin:auto">P</div><h2>Paceletics</h2><div class="muted">Loading Session Builder…</div></div></div>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">P</div><div><h1 style="margin:0;font-size:24px">Session Builder</h1><div class="muted">Plan. Train. Improve.</div></div></div><button class="btn secondary" onclick="location.href='dashboard.html'">← Dashboard</button></header>

<div class="card" style="margin-bottom:13px">
  <div class="saved">
    <div><label>Built sessions</label><select id="savedSession"><option value="">Start a new session</option></select></div>
    <button id="loadSessionBtn" class="btn secondary" type="button">Load session</button>
  </div>
  <div class="muted">Choose a previously saved cloud session to load its details back into the builder.</div>
</div>

<div class="grid">
<div class="card span5"><h3 style="margin-top:0">Build a session</h3><div class="formgrid">
<div><label>Event</label><select id="event"><option>100m</option><option selected>200m</option><option>400m</option><option>800m</option><option>1500m</option></select></div>
<div><label>Training goal</label><select id="goal"><option value="acceleration">Acceleration</option><option value="max_velocity">Max velocity</option><option value="speed_endurance" selected>Speed endurance</option><option value="special_endurance">Special endurance</option><option value="race_modelling">Race modelling</option></select></div>
<div class="full"><label>Session name</label><input id="name" value="Speed Endurance"></div>
<div><label>Main set</label><input id="mainSet" value="3 x 150m"></div>
<div><label>Recovery</label><input id="recovery" value="8 min"></div>
<div><label>Effort %</label><input id="effort" type="number" min="70" max="110" step="1" value="90"></div>
<div><label>Date</label><input id="date" type="date"></div>
<div class="full"><label>Assign to</label><select id="assign"></select></div>
<div class="full"><label>Coach notes</label><textarea id="notes" rows="4" placeholder="Key coaching cues, technical focus or restrictions">Fast but relaxed. Maintain posture and rhythm.</textarea></div>
</div><button id="saveBtn" class="btn primary" style="width:100%;margin-top:12px">Save & assign session</button></div>

<div class="card span7">
  <div class="row"><div><h3 style="margin:0">Target preview</h3><div class="muted">Pick one athlete to view their PB-based target.</div></div><span id="countBadge" class="badge">0 assigned</span></div>
  <div style="margin-top:12px"><label>Preview athlete</label><select id="previewAthlete"></select></div>
  <div id="targets"></div>
</div>

<div class="card span12"><h3 style="margin-top:0">Session preview</h3><div id="summary" class="summary"></div></div>
</div></div>
<script>
const cfg=window.PACELETICS_CONFIG||{};
const sb=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const $=id=>document.getElementById(id);
let user=null;
let state={athletes:[],pbs:[],sessions:[]};
const eventDistance={'100m':100,'200m':200,'400m':400,'800m':800,'1500m':1500};
const goalLabel={acceleration:'Acceleration',max_velocity:'Max velocity',speed_endurance:'Speed endurance',special_endurance:'Special endurance',race_modelling:'Race modelling'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
function timeout(p,ms,msg='Cloud request timed out.'){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error(msg)),ms))])}
function iso(d){return d.toISOString().slice(0,10)}
function fmt(sec){sec=Number(sec);if(!Number.isFinite(sec))return'—';if(sec<60)return sec.toFixed(2)+'s';const m=Math.floor(sec/60),s=sec-m*60;return m+':'+s.toFixed(2).padStart(5,'0')}
function parseRepDistance(text){const m=String(text||'').match(/(?:\d+\s*x\s*)?(\d+)\s*m/i);return m?Number(m[1]):null}
function selectedAthletes(){const v=$('assign').value;if(v==='all')return state.athletes;if(v.startsWith('group:'))return state.athletes.filter(a=>(a.group_name||'')===v.slice(6));if(v.startsWith('athlete:'))return state.athletes.filter(a=>a.id===v.slice(8));return[]}
function pbFor(a,event){return state.pbs.find(p=>p.athlete_id===a.id&&p.event===event)}
function targetFor(a){const event=$('event').value,pb=pbFor(a,event),rep=parseRepDistance($('mainSet').value),effort=Number($('effort').value);if(!pb||!rep||!eventDistance[event]||!effort)return null;return Number(pb.time_seconds)*(rep/eventDistance[event])/(effort/100)}
function extractGoal(s){if(s.training_goal&&goalLabel[s.training_goal])return s.training_goal;const txt=String(s.notes||'').toLowerCase();for(const [k,v] of Object.entries(goalLabel)){if(txt.includes('training goal: '+v.toLowerCase()))return k}return 'speed_endurance'}
function cleanNotes(s){return String(s.notes||'').replace(/\n?Training goal:\s*(Acceleration|Max velocity|Speed endurance|Special endurance|Race modelling)\s*$/i,'').trim()}
function buildAssignOptions(){const groups=[...new Set(state.athletes.map(a=>a.group_name).filter(Boolean))].sort();$('assign').innerHTML='<option value="all">All athletes</option>'+groups.map(g=>`<option value="group:${esc(g)}">Group · ${esc(g)}</option>`).join('')+state.athletes.map(a=>`<option value="athlete:${a.id}">Athlete · ${esc(a.full_name)}</option>`).join('')}
function buildSavedSessions(){const current=$('savedSession').value;$('savedSession').innerHTML='<option value="">Start a new session</option>'+state.sessions.map(s=>`<option value="${s.id}">${esc(s.scheduled_date||'No date')} · ${esc(s.title||'Session')} · ${esc(s.event||'')}</option>`).join('');if([...$('savedSession').options].some(o=>o.value===current))$('savedSession').value=current}
function buildPreviewAthletes(){const list=selectedAthletes(),current=$('previewAthlete').value;$('countBadge').textContent=list.length+' assigned';$('previewAthlete').innerHTML=list.length?list.map(a=>`<option value="${a.id}">${esc(a.full_name)}</option>`).join(''):'<option value="">No athletes selected</option>';if(list.some(a=>a.id===current))$('previewAthlete').value=current;else if(list[0])$('previewAthlete').value=list[0].id}
function renderTarget(){const list=selectedAthletes(),a=list.find(x=>x.id===$('previewAthlete').value)||list[0],event=$('event').value,rep=parseRepDistance($('mainSet').value),effort=Number($('effort').value);if(!a){$('targets').innerHTML='<div class="item muted">No athlete selected.</div>';return}const pb=pbFor(a,event),t=targetFor(a);$('targets').innerHTML=`<div class="item"><div class="row"><strong>${esc(a.full_name)}</strong><span class="badge">${effort||'—'}%</span></div><div class="muted">${esc(event)} PB ${pb?fmt(pb.time_seconds):'not entered'} · ${rep?rep+'m rep':'rep distance not found'}</div><div class="target">${t?fmt(t):'—'}</div><div class="muted">${t?'Target per rep':'Add a '+event+' PB to calculate a target'}</div></div>`}
function renderSummary(){const list=selectedAthletes(),event=$('event').value,effort=Number($('effort').value);$('summary').innerHTML=`<strong>${esc($('name').value||'Untitled session')}</strong><br>${esc(event)} · ${esc(goalLabel[$('goal').value])} · ${esc($('mainSet').value||'No main set')} · ${esc($('recovery').value||'No recovery')}<br><span class="muted">${esc($('date').value||'No date')} · ${effort||'—'}% effort · ${list.length} assigned</span><br><span class="muted">${esc($('notes').value||'No coach notes')}</span>`}
function render(){buildPreviewAthletes();renderTarget();renderSummary()}
function loadSelectedSession(){const id=$('savedSession').value;if(!id)return;const s=state.sessions.find(x=>x.id===id);if(!s)return;$('event').value=s.event||'200m';$('goal').value=extractGoal(s);$('name').value=s.title||'';$('mainSet').value=s.main_set||'';$('recovery').value=s.recovery||'';$('effort').value=s.effort??90;$('date').value=s.scheduled_date||iso(new Date());$('notes').value=cleanNotes(s);render()}
async function save(){const btn=$('saveBtn');try{const athletes=selectedAthletes();if(!athletes.length)throw new Error('Select at least one athlete.');const event=$('event').value,title=$('name').value.trim(),main_set=$('mainSet').value.trim(),recovery=$('recovery').value.trim()||null,effort=Number($('effort').value),scheduled_date=$('date').value||null,training_goal=$('goal').value,notes=$('notes').value.trim()||null;if(!title)throw new Error('Enter a session name.');if(!main_set)throw new Error('Enter the main set.');if(!Number.isFinite(effort)||effort<70||effort>110)throw new Error('Effort must be between 70 and 110%.');btn.disabled=true;btn.textContent='Saving…';let payload={created_by:user.id,title,event,main_set,recovery,effort,notes,scheduled_date,training_goal};let ins=await sb.from('sessions').insert(payload).select().single();if(ins.error&&String(ins.error.message||'').toLowerCase().includes('training_goal')){payload={created_by:user.id,title,event,main_set,recovery,effort,notes:(notes?notes+'\n':'')+'Training goal: '+goalLabel[training_goal],scheduled_date};ins=await sb.from('sessions').insert(payload).select().single()}if(ins.error)throw ins.error;const rows=athletes.map(a=>({session_id:ins.data.id,athlete_id:a.id,assigned_by:user.id,status:'planned'}));const q=await sb.from('assignments').insert(rows);if(q.error){await sb.from('sessions').delete().eq('id',ins.data.id);throw q.error}location.href='dashboard.html'}catch(e){alert(e.message||String(e))}finally{btn.disabled=false;btn.textContent='Save & assign session'}}
async function init(){try{if(!sb)throw new Error('Supabase configuration did not load.');const {data,error}=await timeout(sb.auth.getSession(),6000,'Could not read your sign-in session.');if(error)throw error;if(!data?.session?.user){location.replace('./');return}user=data.session.user;const [a,p,s]=await timeout(Promise.all([sb.from('athletes').select('*').order('full_name'),sb.from('personal_bests').select('*'),sb.from('sessions').select('*').order('created_at',{ascending:false})]),10000);if(a.error)throw a.error;if(p.error)throw p.error;if(s.error)throw s.error;state={athletes:a.data||[],pbs:p.data||[],sessions:s.data||[]};buildAssignOptions();buildSavedSessions();$('date').value=iso(new Date());render();$('loading').classList.add('hidden')}catch(e){$('loading').innerHTML=`<div class="error"><h2>Session Builder could not load</h2><div class="muted">${esc(e.message||String(e))}</div><button class="btn secondary" style="margin-top:12px" onclick="location.href='dashboard.html'">Back to dashboard</button></div>`}}
['event','goal','name','mainSet','recovery','effort','date','notes'].forEach(id=>$(id).addEventListener(id==='goal'||id==='event'||id==='date'?'change':'input',render));
$('assign').addEventListener('change',render);
$('previewAthlete').addEventListener('change',renderTarget);
$('loadSessionBtn').onclick=loadSelectedSession;
$('savedSession').addEventListener('change',()=>{if($('savedSession').value)loadSelectedSession()});
$('saveBtn').onclick=save;
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
