<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paceletics Beta | Sign in</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=0.9.12"></script>
<style>
:root{--bg:#07101d;--panel:#101a2a;--line:#263651;--text:#f6f8fb;--muted:#9caac0;--orange:#ff8a00;--yellow:#ffc400;--red:#ffc0ca}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#172947 0,#0b1628 40%,#07101d 75%);font-family:Inter,system-ui,Arial,sans-serif;color:var(--text)}.card{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 30px 80px #0007}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:grid;place-items:center;color:#171108;font-weight:1000;font-size:22px}.brand h1{margin:0;font-size:26px}.muted{color:var(--muted);font-size:12px}.beta{display:inline-block;padding:4px 8px;border-radius:999px;background:#382811;color:#ffd36d;font-size:11px;font-weight:900;margin:2px 0 14px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0b1524;padding:5px;border-radius:11px;margin-bottom:15px}.tabs button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:8px;font-weight:800}.tabs button.active{background:#21324d;color:#fff}.form{display:grid;gap:11px}.hidden{display:none!important}label{display:block;font-size:12px;color:#cbd6e4;margin-bottom:5px}input,select{width:100%;background:#0b1524;border:1px solid #334966;color:white;padding:11px;border-radius:9px;outline:none}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#171108}.link{border:0;background:none;color:#ffd269;font-weight:800;cursor:pointer}.help{text-align:center}.message{display:none;margin-top:12px;padding:10px 11px;border-radius:9px;font-size:12px;line-height:1.45}.message.show{display:block}.message.ok{background:#102a21;border:1px solid #28563f;color:#a4ecc8}.message.err{background:#321923;border:1px solid #643246;color:var(--red)}
</style></head>
<body>
<div class="card"><div class="brand"><div class="logo">P</div><div><h1>Paceletics</h1><div class="muted">Plan. Train. Improve.</div></div></div><div class="beta">BETA v0.9.12 · CLOUD</div>
<div id="tabs" class="tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Create account</button></div>
<form id="loginForm" class="form"><div><label>Email</label><input id="loginEmail" type="email" autocomplete="email" required></div><div><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn primary" type="submit">Log in</button><div class="help"><button id="forgotBtn" class="link" type="button">Forgot password?</button></div></form>
<form id="signupForm" class="form hidden"><div><label>Name</label><input id="signupName" required></div><div><label>Account type</label><select id="signupRole"><option value="athlete">Athlete</option><option value="coach">Coach</option><option value="club">Club</option></select></div><div><label>Email</label><input id="signupEmail" type="email" required></div><div><label>Password</label><input id="signupPassword" type="password" minlength="8" required></div><button class="btn primary" type="submit">Create Paceletics account</button></form>
<form id="resetForm" class="form hidden"><div><label>New password</label><input id="newPassword" type="password" minlength="8" required></div><button class="btn primary" type="submit">Set new password</button></form><div id="message" class="message"></div></div>
<script>
const cfg=window.PACELETICS_CONFIG||{};const sb=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;const $=id=>document.getElementById(id);
function msg(t,type='err'){const e=$('message');e.textContent=t;e.className='message show '+type}function clearMsg(){$('message').className='message';$('message').textContent=''}function mode(v){clearMsg();$('loginForm').classList.toggle('hidden',v!=='login');$('signupForm').classList.toggle('hidden',v!=='signup');$('resetForm').classList.toggle('hidden',v!=='reset');$('tabs').classList.toggle('hidden',v==='reset');$('loginTab').classList.toggle('active',v==='login');$('signupTab').classList.toggle('active',v==='signup')}
async function go(){const athleteToken=localStorage.getItem('paceleticsPendingAthleteInvite');if(athleteToken){location.replace('join-athlete.html?token='+encodeURIComponent(athleteToken));return}const coachToken=localStorage.getItem('paceleticsPendingClubInvite');if(coachToken){location.replace('join-club.html?token='+encodeURIComponent(coachToken));return}try{const {data}=await sb.auth.getSession();const u=data?.session?.user;if(u){const p=await sb.from('profiles').select('role').eq('id',u.id).maybeSingle();const role=p.data?.role||u.user_metadata?.account_type||u.user_metadata?.role||'athlete';if(role==='athlete'){location.replace('athlete-dashboard.html?v=0.9.12');return}}}catch(e){}location.replace('dashboard.html?v=0.9.12')}
function timeout(p,ms){return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Connection timed out. Please try again.')),ms))])}
async function clearOld(){try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}}
async function init(){await clearOld();if(!sb){msg('Supabase configuration did not load.');return}const params=new URLSearchParams(location.search);if(params.get('athleteInvite')){$('signupRole').value='athlete';msg('Log in with the Athlete account invited by the club. If you need a new account, choose Create account and keep Account type set to Athlete.','ok')}else if(params.get('clubInvite')){$('signupRole').value='coach';msg('Log in with the Coach account invited to the club. If you need a new account, choose Create account and keep Account type set to Coach.','ok')}try{const {data,error}=await timeout(sb.auth.getSession(),6000);if(error)throw error;if(data?.session?.user)await go()}catch(e){msg(e.message)}}
$('loginTab').onclick=()=>mode('login');$('signupTab').onclick=()=>mode('signup');
$('loginForm').onsubmit=async e=>{e.preventDefault();clearMsg();const b=$('loginBtn');b.disabled=true;b.textContent='Logging in…';try{const {error}=await timeout(sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value}),10000);if(error)throw error;await go()}catch(err){msg(err.message)}finally{b.disabled=false;b.textContent='Log in'}};
$('signupForm').onsubmit=async e=>{e.preventDefault();clearMsg();try{const {data,error}=await timeout(sb.auth.signUp({email:$('signupEmail').value.trim(),password:$('signupPassword').value,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:$('signupName').value.trim(),account_type:$('signupRole').value}}}),10000);if(error)throw error;if(data.session)await go();else msg('Account created. Check your email and confirm the account, then log in. Your invitation is saved on this device.','ok')}catch(err){msg(err.message)}};
$('forgotBtn').onclick=async()=>{const email=$('loginEmail').value.trim();if(!email){msg('Enter your email address first.');return}try{const {error}=await timeout(sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}),10000);if(error)throw error;msg('Password reset email sent.','ok')}catch(err){msg(err.message)}};
$('resetForm').onsubmit=async e=>{e.preventDefault();try{const {error}=await timeout(sb.auth.updateUser({password:$('newPassword').value}),10000);if(error)throw error;msg('Password updated. You can continue to Paceletics.','ok');setTimeout(()=>go(),600)}catch(err){msg(err.message)}};
sb?.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')mode('reset');else if(session?.user&&event==='SIGNED_IN')go()});window.addEventListener('DOMContentLoaded',init);
</script></body></html>
