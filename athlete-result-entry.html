<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paceletics | My Result</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=0.9.12"></script>
<style>
:root{--panel:#101a2a;--line:#263651;--text:#f6f8fb;--muted:#9caac0;--orange:#ff8a00;--yellow:#ffc400;--green:#5fe3a1}*{box-sizing:border-box}body{margin:0;background:#07101d;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:grid;place-items:center;color:#171108;font-weight:1000}.muted{color:var(--muted);font-size:12px;line-height:1.45}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#171108}.secondary{background:#1a2942;color:#fff;border:1px solid #314865}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px}.span5{grid-column:span 5}.span7{grid-column:span 7}label{display:block;color:#cbd6e4;font-size:12px;margin-bottom:5px}select,input,textarea{width:100%;background:#0c1525;border:1px solid #334560;color:#fff;padding:11px;border-radius:9px}.field{margin-top:12px}.item{background:#111d31;border:1px solid #263650;border-radius:11px;padding:11px;margin-top:10px}.reps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.rep{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;background:#111d31;border:1px solid #263650;border-radius:10px;padding:8px}.loading{position:fixed;inset:0;background:#07101d;display:grid;place-items:center;text-align:center;z-index:100}.hidden{display:none!important}.error{max-width:560px;background:#171725;border:1px solid #653141;border-radius:16px;padding:20px}@media(max-width:800px){.wrap{padding:13px}.top{align-items:flex-start;flex-direction:column}.span5,.span7{grid-column:span 12}.reps{grid-template-columns:1fr}}
</style></head>
<body>
<div id="loading" class="loading"><div><div class="logo" style="margin:auto">P</div><h2>Paceletics</h2><div class="muted">Loading your sessions…</div></div></div>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">P</div><div><h1 style="margin:0;font-size:24px">Log My Result</h1><div class="muted">Athlete account · Beta v0.9.12</div></div></div><button class="btn secondary" onclick="location.href='dashboard.html?v=0.9.12'">← Dashboard</button></header>
<div class="grid"><section class="card span5"><h3 style="margin-top:0">Choose session</h3><label>My assigned session</label><select id="assignment"><option value="">Choose a session</option></select><div id="sessionInfo" class="item muted">Choose a session to start.</div><div class="field"><label>RPE</label><select id="rpe"><option value="">Choose RPE</option><option value="1">1 · Very easy</option><option value="2">2 · Easy</option><option value="3">3 · Easy</option><option value="4">4 · Comfortable</option><option value="5">5 · Moderate</option><option value="6">6 · Moderately hard</option><option value="7">7 · Hard</option><option value="8">8 · Very hard</option><option value="9">9 · Very hard</option><option value="10">10 · Maximal effort</option></select><div class="muted" style="margin-top:5px">1 = very easy · 5 = moderate · 7 = hard · 10 = maximal</div></div><div class="field"><label>Notes (optional)</label><textarea id="notes" rows="4" placeholder="How did the session feel?"></textarea></div></section>
<section class="card span7"><h3 style="margin-top:0">Rep times</h3><div class="muted">Enter each rep in seconds.</div><div id="repInputs" class="reps"><div class="item muted" style="grid-column:1/-1">Choose a session first.</div></div><button id="saveBtn" class="btn primary" style="width:100%;margin-top:13px">Save result & complete session</button></section></div>
</div>
<script>
const cfg=window.PACELETICS_CONFIG||{};const sb=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;const $=id=>document.getElementById(id);let training=[],current=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseCount(text){const m=String(text||'').match(/(\d+)\s*x/i);return m?Math.max(1,Math.min(30,Number(m[1]))):1}
function reps(result){return Array.isArray(result?.rep_times)?result.rep_times:[]}
function buildReps(count,values=[]){$('repInputs').innerHTML=Array.from({length:Math.max(1,count)},(_,i)=>`<div class="rep"><strong>Rep ${i+1}</strong><input data-rep type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Seconds" value="${values[i]??''}"></div>`).join('')}
function buildList(){const rows=[...training].sort((a,b)=>(a.status==='planned'?0:1)-(b.status==='planned'?0:1)||String(b.scheduled_date||'').localeCompare(String(a.scheduled_date||'')));$('assignment').innerHTML='<option value="">Choose a session</option>'+rows.map(t=>`<option value="${t.assignment_id}">${t.result?'✓ ':''}${esc(t.title||'Session')} · ${esc(t.scheduled_date||'No date')} · ${esc(t.status||'planned')}</option>`).join('')}
function loadAssignment(){current=training.find(t=>t.assignment_id===$('assignment').value)||null;if(!current){$('sessionInfo').innerHTML='Choose a session to start.';$('repInputs').innerHTML='<div class="item muted" style="grid-column:1/-1">Choose a session first.</div>';return}$('sessionInfo').innerHTML=`<strong>${esc(current.title||'Session')}</strong><div class="muted">${esc(current.scheduled_date||'No date')} · ${esc(current.event||'')} · ${esc(current.main_set||'')}</div><div class="muted">${esc(current.recovery||'No recovery')} · ${current.effort||'—'}% effort</div>`;const vals=reps(current.result);buildReps(Math.max(parseCount(current.main_set),vals.length||0),vals);$('rpe').value=current.result?.rpe?String(current.result.rpe):'';$('notes').value=current.result?.notes||'';$('saveBtn').textContent=current.result?'Update result':'Save result & complete session'}
async function save(){const btn=$('saveBtn');try{if(!current)throw new Error('Choose a session.');const vals=[...document.querySelectorAll('[data-rep]')].map(i=>Number(i.value)).filter(v=>Number.isFinite(v)&&v>0);if(!vals.length)throw new Error('Enter at least one rep time.');const rpe=Number($('rpe').value);if(!Number.isInteger(rpe)||rpe<1||rpe>10)throw new Error('Choose an RPE from 1 to 10.');btn.disabled=true;btn.textContent='Saving…';const q=await sb.rpc('save_athlete_result',{p_assignment_id:current.assignment_id,p_rep_times:vals,p_rpe:rpe,p_notes:$('notes').value.trim()||null});if(q.error)throw q.error;alert('Result saved and session completed.');location.href='dashboard.html?v=0.9.12'}catch(e){alert(e.message||String(e))}finally{btn.disabled=false}}
async function init(){try{if(!sb)throw new Error('Supabase configuration did not load.');const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data?.session?.user){location.replace('./');return}const q=await sb.rpc('get_my_athlete_dashboard');if(q.error)throw q.error;if(!q.data?.linked)throw new Error('Your Athlete account is not linked to an athlete profile yet.');training=Array.isArray(q.data.training)?q.data.training:[];buildList();const requested=new URLSearchParams(location.search).get('assignment');if(requested&&training.some(t=>t.assignment_id===requested)){$('assignment').value=requested;loadAssignment()}$('loading').classList.add('hidden')}catch(e){const text=String(e?.message||e||'Unknown error'),missing=/get_my_athlete_dashboard|save_athlete_result/i.test(text)&&/function|schema cache|does not exist|could not find/i.test(text);$('loading').innerHTML=`<div class="error"><h2>${missing?'Athlete database update required':'Athlete result entry could not load'}</h2><div class="muted">${esc(missing?'Run migration_v0_16_athlete_accounts.sql in Supabase, then refresh.':text)}</div><button class="btn secondary" style="margin-top:12px" onclick="location.href='dashboard.html'">Back to Dashboard</button></div>`}}
$('assignment').addEventListener('change',loadAssignment);$('saveBtn').onclick=save;window.addEventListener('DOMContentLoaded',init);
</script></body></html>
