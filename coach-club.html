<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paceletics | My Club</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=0.9.6"></script>
<style>
:root{--panel:#101a2a;--line:#263651;--text:#f6f8fb;--muted:#9caac0;--orange:#ff8a00;--yellow:#ffc400;--green:#5fe3a1}*{box-sizing:border-box}body{margin:0;background:#07101d;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:grid;place-items:center;color:#171108;font-weight:1000}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.secondary{background:#1a2942;color:#fff;border:1px solid #314865}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}.item{background:#111d31;border:1px solid #263650;border-radius:11px;padding:12px;margin-top:8px}.athlete{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#0d192b;border:1px solid #253754;border-radius:10px;padding:10px;margin-top:8px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#17283d;color:#dbe7f6;font-size:11px;font-weight:900}.good{color:var(--green)}.loading{position:fixed;inset:0;background:#07101d;display:grid;place-items:center;text-align:center}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:13px}.top{align-items:flex-start;flex-direction:column}.athlete{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<div id="loading" class="loading"><div><div class="logo" style="margin:auto">P</div><h2>Paceletics</h2><div class="muted">Loading your club…</div></div></div>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">P</div><div><h1 style="margin:0;font-size:24px">My Club</h1><div class="muted">Coach view · Beta v0.9.6</div></div></div><button class="btn secondary" onclick="location.href='dashboard.html?v=0.9.6'">← Dashboard</button></header>
<div id="content"></div>
</div>
<script>
const cfg=window.PACELETICS_CONFIG||{};const sb=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uniqueBy(rows,key){const seen=new Set();return rows.filter(r=>{const v=r[key];if(!v||seen.has(v))return false;seen.add(v);return true})}
async function init(){try{if(!sb)throw new Error('Supabase configuration did not load.');const {data,error}=await sb.auth.getSession();if(error)throw error;const user=data?.session?.user;if(!user){location.replace('./');return}const p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();const role=p.data?.role||user.user_metadata?.account_type||'athlete';if(role!=='coach')throw new Error('My Club is only available to Coach accounts.');const q=await sb.rpc('get_my_coach_club_v2');if(q.error)throw q.error;const rows=q.data||[];if(!rows.length){$('content').innerHTML='<div class="card"><h2 style="margin-top:0">No club linked yet</h2><div class="muted">Accept a Club invitation to link your Coach account.</div></div>';$('loading').classList.add('hidden');return}const clubIds=[...new Set(rows.map(r=>r.club_id))];$('content').innerHTML=clubIds.map(id=>{const clubRows=rows.filter(r=>r.club_id===id),first=clubRows[0],squadRows=uniqueBy(clubRows.filter(r=>r.squad_id),'squad_id');const squadsHtml=squadRows.length?squadRows.map(sr=>{const athletes=uniqueBy(clubRows.filter(r=>r.squad_id===sr.squad_id&&r.athlete_id),'athlete_id');return`<div class="item"><strong>${esc(sr.squad_name)}</strong><div class="muted" style="margin-top:3px">${athletes.length} athlete${athletes.length===1?'':'s'} assigned</div>${athletes.length?athletes.map(a=>`<div class="athlete"><div><strong>${esc(a.athlete_name)}</strong><div class="muted">${[a.athlete_group,a.athlete_primary_event].filter(Boolean).map(esc).join(' · ')||'Athlete'}</div></div><span class="badge good">Squad athlete</span></div>`).join(''):'<div class="athlete muted">No athletes have been assigned to this squad yet.</div>'}</div>`}).join(''):'<div class="item muted">No squads assigned yet.</div>';return`<div class="card"><div class="badge good">Linked Coach</div><h2>${esc(first.club_name||'Club')}</h2><div class="muted">${esc(first.coach_name||'Coach')} · ${esc(first.coach_email||user.email||'')}</div><h3>Assigned squads</h3>${squadsHtml}</div>`}).join('');$('loading').classList.add('hidden')}catch(e){const text=String(e?.message||e||'Unknown error');const missing=/get_my_coach_club_v2|squad_athletes/i.test(text)&&/function|schema cache|could not find|does not exist|relation/i.test(text);$('loading').innerHTML='<div class="card"><h2>'+(missing?'Coach database update required':'My Club could not load')+'</h2><div class="muted">'+esc(missing?'Run migration_v0_12_squad_athletes.sql in Supabase, then refresh.':text)+'</div><button class="btn secondary" style="margin-top:12px" onclick="location.href=\'dashboard.html\'">Back to dashboard</button></div>'}}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
