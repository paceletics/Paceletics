<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paceletics | Athlete Accounts</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07101d">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=0.9.15"></script><script src="paceletics-shell.js?v=1.0.0"></script>
<style>
:root{--panel:#101a2a;--line:#263651;--text:#f6f8fb;--muted:#9caac0;--orange:#ff8a00;--yellow:#ffc400;--green:#5fe3a1;--red:#ff9aaa}*{box-sizing:border-box}body{margin:0;background:#07101d;color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input{font:inherit}.wrap{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.brand{display:flex;gap:10px;align-items:center}.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--yellow));display:grid;place-items:center;color:#171108;font-weight:1000}.muted{color:var(--muted);font-size:12px;line-height:1.45}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--orange),var(--yellow));color:#171108}.secondary{background:#1a2942;color:#fff;border:1px solid #314865}.danger{background:#3a1d27;color:#ffc1c8;border:1px solid #653141}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}.item{background:#111d31;border:1px solid #263650;border-radius:11px;padding:12px;margin-top:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:end}.inviteForm{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px;margin-top:10px}.inviteForm input{width:100%;background:#0c1525;border:1px solid #334560;color:#fff;padding:10px;border-radius:9px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#17283d;color:#dbe7f6;font-size:11px;font-weight:900}.good{color:var(--green)}.pending{color:#ffd469}.loading{position:fixed;inset:0;background:#07101d;display:grid;place-items:center;text-align:center;z-index:100}.hidden{display:none!important}.error{max-width:560px;background:#171725;border:1px solid #653141;border-radius:16px;padding:20px}@media(max-width:700px){.wrap{padding:13px}.top,.row{flex-direction:column;align-items:flex-start}.inviteForm{grid-template-columns:1fr}.actions,.actions .btn{width:100%}.actions .btn{flex:1}}
</style></head>
<body>
<div id="loading" class="loading"><div><div class="logo" style="margin:auto">P</div><h2>Paceletics</h2><div class="muted">Loading Athlete Accounts…</div></div></div>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">P</div><div><h1 style="margin:0;font-size:24px">Athlete Accounts</h1><div class="muted">Secure Club → Athlete linking · Beta v0.9.15</div></div></div><button class="btn secondary" onclick="location.href='club.html?v=0.9.15'">← Club Management</button></header>
<div class="card"><h2 id="clubName" style="margin:0 0 4px">Club</h2><div class="muted">Create a secure invite for an existing athlete record. The invited email must sign in with an Athlete account before the profile can be linked.</div></div>
<div class="card"><h3 style="margin-top:0">Athlete profiles</h3><div id="athletes"></div></div>
</div>
<script>
const cfg=window.PACELETICS_CONFIG||{};const sb=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;const $=id=>document.getElementById(id);let user=null,club=null,state={athletes:[],invites:[]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
function pending(athleteId){return state.invites.find(x=>x.athlete_id===athleteId&&x.status==='pending'&&new Date(x.expires_at)>new Date())||null}
function inviteUrl(inv){const u=new URL('join-athlete.html',location.href);u.searchParams.set('token',inv.token);return u.href}
async function copyText(text){try{await navigator.clipboard.writeText(text);alert('Athlete invite link copied.')}catch(e){prompt('Copy this athlete invite link:',text)}}
async function load(){const [a,i]=await Promise.all([sb.from('athletes').select('id,full_name,group_name,primary_event,linked_user_id').eq('owner_user_id',user.id).order('full_name'),sb.from('athlete_invites').select('*').eq('club_id',club.id).order('created_at',{ascending:false})]);if(a.error)throw a.error;if(i.error)throw i.error;state={athletes:a.data||[],invites:i.data||[]};render()}
function render(){$('clubName').textContent=club?.name||'Club';$('athletes').innerHTML=state.athletes.length?state.athletes.map(a=>{const inv=pending(a.id),linked=!!a.linked_user_id;let controls='';if(linked){controls='<span class="badge good">Linked Athlete account</span>'}else if(inv){controls=`<div class="actions"><button class="btn primary" data-copy="${inv.id}">Copy invite</button><button class="btn secondary" data-revoke="${inv.id}">Revoke</button></div><div class="muted" style="margin-top:6px">Invite: ${esc(inv.email)} · expires ${esc(String(inv.expires_at).slice(0,10))}</div>`}else{controls=`<div class="inviteForm"><input type="email" data-email="${a.id}" placeholder="Athlete email address"><button class="btn primary" data-create="${a.id}">Create invite</button></div>`}return`<div class="item"><div class="row"><div><strong>${esc(a.full_name)}</strong><div class="muted">${[a.group_name,a.primary_event].filter(Boolean).map(esc).join(' · ')||'Athlete'}</div></div><div>${linked?'<span class="badge good">Linked</span>':inv?'<span class="badge pending">Invite pending</span>':'<span class="badge">Not linked</span>'}</div></div>${controls}</div>`}).join(''):'<div class="item muted">No athlete profiles exist yet.</div>';document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>createInvite(b.dataset.create));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const inv=state.invites.find(x=>x.id===b.dataset.copy);if(inv)copyText(inviteUrl(inv))});document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>revokeInvite(b.dataset.revoke))}
async function createInvite(athleteId){const input=document.querySelector(`[data-email="${athleteId}"]`),email=(input?.value||'').trim().toLowerCase();if(!email||!email.includes('@')){alert('Enter the athlete email address.');return}try{const old=state.invites.find(x=>x.athlete_id===athleteId&&x.status==='pending');if(old){if(new Date(old.expires_at)>new Date()){await copyText(inviteUrl(old));return}await sb.from('athlete_invites').update({status:'expired'}).eq('id',old.id)}const q=await sb.from('athlete_invites').insert({club_id:club.id,athlete_id:athleteId,email}).select().single();if(q.error)throw q.error;await load();await copyText(inviteUrl(q.data))}catch(e){alert(e.message||String(e))}}
async function revokeInvite(id){if(!confirm('Revoke this athlete invite?'))return;const q=await sb.from('athlete_invites').update({status:'revoked'}).eq('id',id);if(q.error)alert(q.error.message);else await load()}
async function init(){try{if(!sb)throw new Error('Supabase configuration did not load.');const {data,error}=await sb.auth.getSession();if(error)throw error;user=data?.session?.user;if(!user){location.replace('./');return}const p=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();if(p.error)throw p.error;if(p.data?.role!=='club')throw new Error('Athlete Accounts is only available to Club accounts.');const c=await sb.from('clubs').select('*').eq('owner_user_id',user.id).maybeSingle();if(c.error)throw c.error;if(!c.data)throw new Error('Set up your Club first.');club=c.data;await load();$('loading').classList.add('hidden')}catch(e){const text=String(e?.message||e||'Unknown error'),missing=/athlete_invites/i.test(text)&&/relation|schema cache|does not exist|could not find/i.test(text);$('loading').innerHTML=`<div class="error"><h2>${missing?'Athlete database update required':'Athlete Accounts could not load'}</h2><div class="muted">${esc(missing?'Run migration_v0_16_athlete_accounts.sql in Supabase, then refresh.':text)}</div><button class="btn secondary" style="margin-top:12px" onclick="location.href='club.html?v=0.9.15'">Back to Club Management</button></div>`}}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
